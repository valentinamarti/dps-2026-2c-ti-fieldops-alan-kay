spring:
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///fieldops?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
fieldops:
  events:
    dispatcher-enabled: false
    dispatch-interval: 2s
    max-attempts: 5
    initial-backoff: 1s
    max-backoff: 30s
