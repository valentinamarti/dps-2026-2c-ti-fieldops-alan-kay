spring:
  datasource:
    url: ${FIELDOPS_DB_URL:jdbc:postgresql://localhost:5433/fieldops}
    username: ${FIELDOPS_DB_USER:fieldops}
    password: ${FIELDOPS_DB_PASSWORD:fieldops}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
fieldops:
  events:
    dispatcher-enabled: true
    dispatch-interval: 2s
    max-attempts: 5
    initial-backoff: 1s
    max-backoff: 30s
